spring:
  application:
    name: Polaris
  datasource:
    url: jdbc:h2:file:./data/polaris;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema, Hibernate only validates it
    properties:
      hibernate:
        format_sql: true  
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://id.polaris.local/realms/polaris
springdoc:
  swagger-ui:
    oauth:
      client-id: polaris-local
      use-pkce-with-authorization-code-grant: true

management:
  tracing:
    sampling:
      probability: 1.0 
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus