server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: Polaris-Assistant
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/polaris_assistant;AUTO_SERVER=TRUE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:https://id.polaris.local/realms/polaris}

polaris:
  ai:
    provider: gemini
    api-key: ${GEMINI_API_KEY:${POLARIS_AI_API_KEY:}}
    model: ${POLARIS_AI_MODEL:gemini-3.6-flash}
    base-url: ${POLARIS_AI_BASE_URL:https://generativelanguage.googleapis.com}
    timeout-seconds: ${POLARIS_AI_TIMEOUT_SECONDS:30}
  typesafe:
    api-key: ${TYPESAFE_API_KEY:${POLARIS_TYPESAFE_API_KEY:}}
    model: ${POLARIS_TYPESAFE_MODEL:jev-latest}
    base-url: ${POLARIS_TYPESAFE_BASE_URL:https://api.typesafe.ai}
    timeout-seconds: ${POLARIS_TYPESAFE_TIMEOUT_SECONDS:15}
  mcp:
    core:
      url: ${POLARIS_CORE_MCP_URL:http://localhost:8080/mcp}
      message-endpoint: ${POLARIS_CORE_MCP_MESSAGE_ENDPOINT:http://localhost:8080/mcp}
  core:
    rest:
      base-url: ${POLARIS_CORE_REST_BASE_URL:http://localhost:8080}
  assistant:
    draft:
      ttl: ${POLARIS_ASSISTANT_DRAFT_TTL:PT15M}
      expiration-sweep-interval: ${POLARIS_ASSISTANT_DRAFT_EXPIRATION_SWEEP_INTERVAL:PT60S}
    intent:
      file: ${POLARIS_ASSISTANT_INTENT_FILE:classpath:intents.json}
      redis:
        key: ${POLARIS_ASSISTANT_INTENT_REDIS_KEY:polaris:assistant:intents}
        local-cache-ttl: ${POLARIS_ASSISTANT_INTENT_REDIS_LOCAL_CACHE_TTL:30s}
        fallback-retry-interval: ${POLARIS_ASSISTANT_INTENT_REDIS_FALLBACK_RETRY_INTERVAL:5s}
        seed-if-missing: ${POLARIS_ASSISTANT_INTENT_REDIS_SEED_IF_MISSING:true}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    oauth:
      client-id: polaris-app
      use-pkce-with-authorization-code-grant: true

management:
  endpoint:
    health:
      probes:
        enabled: true
      # Readiness reflects whether this instance can actually serve the assistant: it needs
      # Gemini, TypeSafe and the Polaris Core MCP server all reachable, on top of the base
      # readinessState. Liveness stays untouched by these, since a dependency outage should
      # take the pod out of load-balancing (not ready), not restart a process that is otherwise
      # healthy (live).
      group:
        readiness:
          include: readinessState,gemini,typeSafe,polarisMcp
  endpoints:
    web:
      exposure:
        include: health,info # ,metrics,prometheus
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        url: ${MANAGEMENT_OTLP_METRICS_EXPORT_URL:http://localhost:4318/v1/metrics}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
    logging:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT:http://localhost:4318/v1/logs}
