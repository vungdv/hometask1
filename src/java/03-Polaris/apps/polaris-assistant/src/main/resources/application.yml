server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: Polaris-Assistant
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/polaris_assistant;AUTO_SERVER=TRUE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:https://id.polaris.local/realms/polaris}

polaris:
  ai:
    provider: gemini
    api-key: ${GEMINI_API_KEY:${POLARIS_AI_API_KEY:}}
    model: ${POLARIS_AI_MODEL:gemini-3.6-flash}
    base-url: ${POLARIS_AI_BASE_URL:https://generativelanguage.googleapis.com}
    timeout-seconds: ${POLARIS_AI_TIMEOUT_SECONDS:30}
    # Grafana AI Observability (agento11y SDK): OTel GenAI semconv spans + gen_ai.client.* metrics.
    telemetry:
      agent-version: ${AGENTO11Y_AGENT_VERSION:}
      content-capture: ${AGENTO11Y_CONTENT_CAPTURE_MODE:metadata_only}
      # none = no generation export (local). http/grpc + AGENTO11Y_ENDPOINT/AGENTO11Y_AUTH_* = Grafana Cloud Conversations.
      generation-export-protocol: ${AGENTO11Y_PROTOCOL:none}
      metrics-endpoint: ${management.otlp.metrics.export.url}
  typesafe:
    api-key: ${TYPESAFE_API_KEY:${POLARIS_TYPESAFE_API_KEY:}}
    model: ${POLARIS_TYPESAFE_MODEL:jev-latest}
    base-url: ${POLARIS_TYPESAFE_BASE_URL:https://api.typesafe.ai}
    timeout-seconds: ${POLARIS_TYPESAFE_TIMEOUT_SECONDS:15}
  core:
    api:
      # Order Management REST contract, used to resolve the caller's own customer (GET /api/v1/customers/me)
      base-url: ${POLARIS_CORE_API_BASE_URL:http://localhost:8080}
  mcp:
    core:
      url: ${POLARIS_CORE_MCP_URL:http://localhost:8080/mcp}
      message-endpoint: ${POLARIS_CORE_MCP_MESSAGE_ENDPOINT:http://localhost:8080/mcp}
  assistant:
    intent:
      file: ${POLARIS_ASSISTANT_INTENT_FILE:classpath:intents.json}
      redis:
        key: ${POLARIS_ASSISTANT_INTENT_REDIS_KEY:polaris:assistant:intents}
        local-cache-ttl: ${POLARIS_ASSISTANT_INTENT_REDIS_LOCAL_CACHE_TTL:30s}
        fallback-retry-interval: ${POLARIS_ASSISTANT_INTENT_REDIS_FALLBACK_RETRY_INTERVAL:5s}
        seed-if-missing: ${POLARIS_ASSISTANT_INTENT_REDIS_SEED_IF_MISSING:true}
    # Circuit breakers on TypeSafe (intent classification) and Gemini (replies).
    # TypeSafe open -> every turn is pinned to degraded-intent and the reply says only order status works.
    # Gemini open -> POST /chat answers 503 Problem Details "temporarily down" with Retry-After.
    resilience:
      degraded-intent: ${POLARIS_ASSISTANT_DEGRADED_INTENT:information.lookup.order.status}
      circuit-breaker:
        failure-rate-threshold: ${POLARIS_ASSISTANT_CB_FAILURE_RATE_THRESHOLD:50}
        sliding-window-size: ${POLARIS_ASSISTANT_CB_SLIDING_WINDOW_SIZE:10}
        minimum-number-of-calls: ${POLARIS_ASSISTANT_CB_MINIMUM_NUMBER_OF_CALLS:4}
        wait-duration-in-open-state: ${POLARIS_ASSISTANT_CB_WAIT_DURATION_IN_OPEN_STATE:30s}
        permitted-number-of-calls-in-half-open-state: ${POLARIS_ASSISTANT_CB_PERMITTED_CALLS_IN_HALF_OPEN_STATE:2}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    oauth:
      client-id: polaris-app
      use-pkce-with-authorization-code-grant: true

management:
  endpoint:
    health:
      probes:
        enabled: true
      # Readiness needs the Polaris Core MCP server on top of the base readinessState. Gemini and
      # TypeSafe are guarded by circuit breakers instead (TypeSafe down -> order-status-only mode,
      # Gemini down -> 503 "temporarily down"), so their outage must not pull the instance out of
      # load-balancing: shoppers would get a gateway error instead of that message. Both still
      # show under /actuator/health. Liveness stays untouched by any dependency.
      group:
        readiness:
          include: readinessState,polarisMcp
  endpoints:
    web:
      exposure:
        include: health,info # ,metrics,prometheus
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  # Explicit histogram buckets (none by default, so no percentile was computable).
  # They include the SLO thresholds in docker/telemetry/prometheus/rules/assistant-slo.rules.yml (2s, 30s).
  metrics:
    distribution:
      slo:
        http.server.requests: 100ms,250ms,500ms,1s,2s,5s,10s,20s,30s,60s
        # staging -> decision; the price hold (draft TTL) is 15 min
        polaris.assistant.draft.lifetime: 15s,30s,1m,2m,5m,10m,15m,30m
  otlp:
    metrics:
      export:
        url: ${MANAGEMENT_OTLP_METRICS_EXPORT_URL:http://localhost:4318/v1/metrics}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
    logging:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT:http://localhost:4318/v1/logs}
