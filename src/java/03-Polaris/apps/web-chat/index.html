<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Polaris Assistant</title>
  <link rel="stylesheet" href="/chat/style.css" />
</head>
<body>
  <div class="chat-app">
    <!-- Header -->
    <header class="chat-header">
      <div class="brand">
        <div class="logo" aria-hidden="true">★</div>
        <div class="brand-info">
          <h1>Polaris Assistant</h1>
          <span class="status-badge"><span class="status-dot"></span> AI Online</span>
        </div>
      </div>
      <div class="actions">
        <button id="new-chat-btn" class="btn btn-secondary" type="button" title="Start a fresh chat">New Chat</button>
      </div>
    </header>

    <!-- Message History -->
    <main id="chat-messages" class="chat-messages" role="log" aria-live="polite">
      <div class="message assistant-msg welcome-msg">
        <div class="avatar">★</div>
        <div class="bubble">
          <p>Hello! I am your <strong>Polaris Assistant</strong>. How can I help you today?</p>
        </div>
      </div>
    </main>

    <!-- Input Form -->
    <footer class="chat-footer">
      <form id="chat-form" class="chat-form" novalidate>
        <input
          type="text"
          id="chat-input"
          class="chat-input"
          placeholder="Ask anything about our products, store, or orders..."
          autocomplete="off"
          required
        />
        <button type="submit" id="send-btn" class="send-btn" aria-label="Send message">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
    </footer>
  </div>

  <script src="/chat/app.js"></script>
</body>
</html>
