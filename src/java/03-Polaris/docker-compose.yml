services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - keycloak
      - polaris
      - polaris-assistant
      - swagger-ui
    networks:
      polaris-net:
        aliases:
          - id.polaris.local
          - polaris.local
          - grafana.polaris.local
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    container_name: swagger-ui
    environment:
      # Multiple specs -> renders a dropdown selector in the Swagger UI top bar
      URLS: >
        [
          {url: "/v3/api-docs", name: "Product Catalog API"},
          {url: "/v3/api-docs/assistant", name: "Assistant API"}
        ]
      # optional: avoids CORS issues since nginx proxies same-origin
      BASE_URL: /swagger-ui
      OAUTH_CLIENT_ID: polaris-app
      OAUTH_USE_PKCE: "true"
    expose:
      - "8080"
    networks:
      - polaris-net
  polaris:
    build:
      context: .
      dockerfile: apps/polaris/Dockerfile
    container_name: polaris
    user: root
    # We don't need export port here
    # access to container go through nginx under domain polaris.local
    # ports:
    #   - "8080:8080"
    environment:
      # DEBUG: "true"
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      # Access Keycloak through its canonical public issuer URL.
      # Internally, id.polaris.local resolves to the nginx container.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://id.${POLARIS_DOMAIN}/realms/polaris 
      SPRING_DATASOURCE_URL: jdbc:postgresql://polaris-db:5432/polaris
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_USERNAME: polaris
      SPRING_DATASOURCE_PASSWORD: polaris
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRINGDOC_SWAGGER-UI_OAUTH_CLIENT-ID: "polaris-app"
      SPRINGDOC_SWAGGER-UI_OAUTH_USE-PKCE-WITH-AUTHORIZATION-CODE-GRANT: "true"
      JAVA_TOOL_OPTIONS: "-Djavax.net.ssl.trustStore=/certs/truststore.jks"
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: http://otel-collector:4318/v1/metrics
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT: http://otel-collector:4318/v1/logs
      # Enable 100% sampling for tracing in this local dev environment.
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      # LOGGING_LEVEL_IO_OPENTELEMETRY: DEBUG
      # LOGGING_LEVEL_IO_OPENTELEMETRY_EXPORTER_OTLP: DEBUG
      LOGGING_LEVEL_ORG_HIBERNATE_ORM_JDBC_BIND: DEBUG
      MANAGEMENT_ENDPOINT_HEALTH_SHOW-DETAILS: always
      SPRING_JPA_SHOW-SQL: true
    ports:
      - "8080:8080"
    volumes:
      - ./docker/nginx/truststore.jks:/certs/truststore.jks:ro
    depends_on:
      keycloak:
        condition: service_healthy
      otel-collector:
        condition: service_started
      polaris-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health/liveness && curl -f http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - polaris-net
  polaris-assistant:
    build:
      context: .
      dockerfile: apps/polaris-assistant/Dockerfile
    container_name: polaris-assistant
    user: root
    environment:
      SERVER_PORT: "8081"
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://id.${POLARIS_DOMAIN}/realms/polaris
      SPRING_DATASOURCE_URL: jdbc:postgresql://polaris-db:5432/polaris
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_USERNAME: polaris
      SPRING_DATASOURCE_PASSWORD: polaris
      POLARIS_MCP_CORE_URL: http://polaris:8080/mcp
      POLARIS_MCP_CORE_MESSAGE_ENDPOINT: http://polaris:8080/mcp
      POLARIS_CORE_REST_BASE_URL: http://polaris:8080
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      SPRINGDOC_SWAGGER-UI_OAUTH_CLIENT-ID: "polaris-app"
      SPRINGDOC_SWAGGER-UI_OAUTH_USE-PKCE-WITH-AUTHORIZATION-CODE-GRANT: "true"
      JAVA_TOOL_OPTIONS: "-Djavax.net.ssl.trustStore=/certs/truststore.jks"
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: http://otel-collector:4318/v1/metrics
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT: http://otel-collector:4318/v1/logs
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      MANAGEMENT_ENDPOINT_HEALTH_SHOW-DETAILS: always
    ports:
      - "8081:8081"
    volumes:
      - ./docker/nginx/truststore.jks:/certs/truststore.jks:ro
    depends_on:
      keycloak:
        condition: service_healthy
      polaris:
        condition: service_healthy
      polaris-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      # readiness now probes Gemini, TypeSafe and the Polaris Core MCP server (up to 2s each,
      # run sequentially), so the timeout allows for that worst case plus the liveness call.
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health/liveness && curl -f http://localhost:8081/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 8s
      retries: 5
      start_period: 30s
    networks:
      - polaris-net
  redis:
    image: redis:7-alpine
    container_name: redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - polaris-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  polaris-db:
    image: postgres:16
    container_name: polaris-postgres
    environment:
      POSTGRES_DB: polaris
      POSTGRES_USER: polaris
      POSTGRES_PASSWORD: polaris
    volumes:
      - polaris_db_data:/var/lib/postgresql/data
    networks:
      - polaris-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polaris -d polaris"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16
    container_name: keycloak-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    networks:
      - polaris-net
      
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: https://id.${POLARIS_DOMAIN}
      KC_TRACING_ENABLED: "true"
      KC_TRACING_ENDPOINT: http://otel-collector:4317
      KC_TRACING_SERVICE_NAME: keycloak
      KC_TRACING_SAMPLER_TYPE: traceidratio
      KC_TRACING_SAMPLER_RATIO: "1.0"
    # ports:
    #   - "8081:8080"
    volumes:
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    depends_on:
      postgres:
        condition: service_started
      otel-collector:
        condition: service_started
    networks:
      - polaris-net
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  keycloak_db_data:
  polaris_db_data: