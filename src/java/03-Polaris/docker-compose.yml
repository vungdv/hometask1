services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - keycloak
      - app
    networks:
      - polaris-net
  app:
    build: .
    container_name: polaris
    user: root
    # We don't need export port here
    # access to container go through nginx under domain polaris.local
    # ports:
    #   - "8080:8080"
    environment:
      # DEBUG: "true"
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://id.${POLARIS_DOMAIN}/realms/polaris # Back-channel communication via keycloak-net network.
      SPRING_DATASOURCE_URL: jdbc:h2:file:/app/data/polaris
      SPRING_DATASOURCE_DRIVER-CLASS-NAME: org.h2.Driver
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ""
      SPRINGDOC_SWAGGER-UI_OAUTH_CLIENT-ID: "polaris-app"
      SPRINGDOC_SWAGGER-UI_OAUTH_USE-PKCE-WITH-AUTHORIZATION-CODE-GRANT: "true"
      JAVA_TOOL_OPTIONS: "-Djavax.net.ssl.trustStore=/certs/truststore.jks"
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: http://otel-collector:4318/v1/metrics
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      OTEL_SERVICE_NAME: polaris
      LOGGING_LEVEL_IO_OPENTELEMETRY: DEBUG
      LOGGING_LEVEL_IO_OPENTELEMETRY_EXPORTER_OTLP: DEBUG
    extra_hosts:
      - "id.polaris.local:host-gateway"
    volumes:
      - ./nginx/truststore.jks:/certs/truststore.jks:ro
    depends_on:
      keycloak:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - polaris-net
  postgres:
    image: postgres:16
    container_name: keycloak-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    networks:
      - polaris-net
      
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_PROXY: edge
      KC_TRACING_ENABLED: "true"
      KC_TRACING_ENDPOINT: http://otel-collector:4317
      KC_TRACING_SERVICE_NAME: keycloak
      KC_TRACING_SAMPLER_TYPE: traceidratio
      KC_TRACING_SAMPLER_RATIO: "1.0"
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    depends_on:
      postgres:
        condition: service_started
      otel-collector:
        condition: service_started
    networks:
      - polaris-net
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 5s
      timeout: 5s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./telemetry/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    networks:
      - polaris-net

volumes:
  keycloak_db_data:

networks:
  polaris-net: