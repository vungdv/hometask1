events {}

http {
  # Redirect all HTTP to HTTPS
  server {
    listen 80;
    server_name polaris.local assistant.polaris.local id.polaris.local grafana.polaris.local;
    return 301 https://$host$request_uri;
  }

  # Core App
  server {
    listen 443 ssl;
    server_name polaris.local;

    ssl_certificate     /etc/nginx/certs/polaris.local+1.pem;
    ssl_certificate_key /etc/nginx/certs/polaris.local+1-key.pem;

    location / {
      proxy_pass http://polaris:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;
    }

    # MCP SSE Endpoint Buffer Disabling
    location /mcp/ {
      proxy_pass http://polaris:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;

      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_cache off;
    }
  }

  # Assistant App
  server {
    listen 443 ssl;
    server_name assistant.polaris.local;

    ssl_certificate     /etc/nginx/certs/polaris.local+1.pem;
    ssl_certificate_key /etc/nginx/certs/polaris.local+1-key.pem;

    location / {
      proxy_pass http://polaris-assistant:8081;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;

      # Real-time SSE streaming support
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_cache off;
    }
  }

  # Keycloak
  server {
    listen 443 ssl;
    server_name id.polaris.local;

    ssl_certificate     /etc/nginx/certs/polaris.local+1.pem;
    ssl_certificate_key /etc/nginx/certs/polaris.local+1-key.pem;

    location / {
      proxy_pass http://keycloak:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;
    }
  }

  # Grafana
  server {
    listen 443 ssl;
    server_name grafana.polaris.local;

    ssl_certificate     /etc/nginx/certs/polaris.local+1.pem;
    ssl_certificate_key /etc/nginx/certs/polaris.local+1-key.pem;

    location / {
      proxy_pass http://grafana:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;

      # WebSocket support for Grafana Live
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}