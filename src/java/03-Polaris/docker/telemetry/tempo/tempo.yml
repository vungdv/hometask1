server:
  http_listen_port: 3200

distributor:
  receivers:

    otlp:
      protocols:

        grpc:
          endpoint: 0.0.0.0:4317

        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local

    local:
      path: /var/tempo/traces

# Span-derived metrics (plan O2 / D3): span-metrics + service-graphs, remote-written to
# Prometheus (which enables the remote-write receiver and exemplar storage).
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  processor:
    span_metrics:
      dimensions: [http.request.method, http.response.status_code, http.route, polaris.sse]
      enable_target_info: true
    service_graphs:
      dimensions: []

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
