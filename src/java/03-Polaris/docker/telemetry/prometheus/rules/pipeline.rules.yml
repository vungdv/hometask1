# Plan O5 / OBS-PIPE-1: the telemetry pipeline alerts on its own failure (design section 5). Proposals.
# Collector self-metrics have no _total suffix; failure counters only exist after the first failure.
groups:
  - name: telemetry-pipeline
    rules:
      - alert: TelemetryCollectorDown
        expr: (up{job="otel-collector-self"} == 0) or absent(up{job="otel-collector-self"})
        for: 2m
        labels: {severity: page, owner: platform, service: otel-collector}
        annotations:
          summary: "OpenTelemetry Collector is down: all telemetry is being lost"
          description: "Prometheus cannot scrape the Collector self-metrics (otel-collector:8888)."
          service: "otel-collector"
          severity: "page"
          dashboard_url: "https://grafana.polaris.local/d/polaris-telemetry-pipeline/telemetry-pipeline"
          runbook_url: "https://github.com/vungdv/hometask1/blob/main/src/java/03-Polaris/docs/operations/runbooks/telemetry-collector-down.md"

      - alert: TelemetryCollectorRefusing
        expr: |
          (sum(rate(otelcol_receiver_refused_spans[5m])) or vector(0))
          + (sum(rate(otelcol_receiver_refused_metric_points[5m])) or vector(0))
          + (sum(rate(otelcol_receiver_refused_log_records[5m])) or vector(0)) > 0
        for: 5m
        labels: {severity: ticket, owner: platform, service: otel-collector}
        annotations:
          summary: "Collector is refusing incoming telemetry ({{ $value | humanize }}/s)"
          description: "The memory_limiter or a receiver is refusing spans, metric points or log records; senders may drop data."
          service: "otel-collector"
          severity: "ticket"
          dashboard_url: "https://grafana.polaris.local/d/polaris-telemetry-pipeline/telemetry-pipeline"
          runbook_url: "https://github.com/vungdv/hometask1/blob/main/src/java/03-Polaris/docs/operations/runbooks/telemetry-collector-refusing.md"

      - alert: TelemetryCollectorDropping
        expr: |
          (sum(rate(otelcol_exporter_send_failed_spans[5m])) or vector(0))
          + (sum(rate(otelcol_exporter_send_failed_metric_points[5m])) or vector(0))
          + (sum(rate(otelcol_exporter_send_failed_log_records[5m])) or vector(0))
          + (sum(rate(otelcol_exporter_enqueue_failed_spans[5m])) or vector(0))
          + (sum(rate(otelcol_exporter_enqueue_failed_metric_points[5m])) or vector(0))
          + (sum(rate(otelcol_exporter_enqueue_failed_log_records[5m])) or vector(0)) > 0
        for: 5m
        labels: {severity: ticket, owner: platform, service: otel-collector}
        annotations:
          summary: "Collector is dropping telemetry ({{ $value | humanize }}/s failed to export or enqueue)"
          description: "Exports to a backend fail after retries, or the bounded sending queue is full."
          service: "otel-collector"
          severity: "ticket"
          dashboard_url: "https://grafana.polaris.local/d/polaris-telemetry-pipeline/telemetry-pipeline"
          runbook_url: "https://github.com/vungdv/hometask1/blob/main/src/java/03-Polaris/docs/operations/runbooks/telemetry-collector-dropping.md"

      - alert: TelemetryExporterQueueNearFull
        expr: (otelcol_exporter_queue_size / otelcol_exporter_queue_capacity) > 0.8
        for: 5m
        labels: {severity: ticket, owner: platform, service: otel-collector}
        annotations:
          summary: "Collector exporter queue {{ $labels.exporter }} is {{ $value | humanizePercentage }} full"
          description: "The backend is slow or down; the queue drops new data when full."
          service: "otel-collector"
          severity: "ticket"
          dashboard_url: "https://grafana.polaris.local/d/polaris-telemetry-pipeline/telemetry-pipeline"
          runbook_url: "https://github.com/vungdv/hometask1/blob/main/src/java/03-Polaris/docs/operations/runbooks/telemetry-exporter-queue-near-full.md"

      - alert: TelemetryBackendDown
        expr: up{job=~"tempo|loki|grafana"} == 0
        for: 2m
        labels: {severity: ticket, owner: platform}
        annotations:
          summary: "Telemetry backend {{ $labels.job }} is down"
          description: "Prometheus cannot scrape {{ $labels.job }} ({{ $labels.instance }})."
          service: "{{ $labels.job }}"
          severity: "ticket"
          dashboard_url: "https://grafana.polaris.local/d/polaris-telemetry-pipeline/telemetry-pipeline"
          runbook_url: "https://github.com/vungdv/hometask1/blob/main/src/java/03-Polaris/docs/operations/runbooks/telemetry-backend-down.md"

      - alert: GatewayDown
        # The Collector's prometheus exporter keeps re-exporting the last nginx values after the gateway dies (found live:
        # nginx_connections_current stayed for 20+ minutes), so absence of that metric is NOT a usable signal. The scraper's
        # own counter of scraped points stops increasing as soon as stub_status cannot be scraped.
        expr: (sum(rate(otelcol_scraper_scraped_metric_points{receiver="nginx"}[2m])) == 0) or absent(otelcol_scraper_scraped_metric_points{receiver="nginx"})
        for: 1m
        labels: {severity: page, owner: platform, service: nginx-gateway}
        annotations:
          summary: "The nginx gateway is down or not reporting: the edge is unavailable"
          description: "The Collector has not been able to scrape nginx stub_status for 2 minutes. Inhibited while the Collector itself is down."
          service: "nginx-gateway"
          severity: "page"
          dashboard_url: "https://grafana.polaris.local/d/polaris-edge/edge-gateway"
          runbook_url: "https://github.com/vungdv/hometask1/blob/main/src/java/03-Polaris/docs/operations/runbooks/gateway-down.md"

      - alert: AlertmanagerDown
        expr: up{job="alertmanager"} == 0
        for: 2m
        labels: {severity: ticket, owner: platform, service: alertmanager}
        annotations:
          summary: "Alertmanager is down: alerts cannot be delivered"
          description: "Prometheus cannot scrape alertmanager:9093."
          service: "alertmanager"
          severity: "ticket"
          dashboard_url: "https://grafana.polaris.local/d/polaris-telemetry-pipeline/telemetry-pipeline"
          runbook_url: "https://github.com/vungdv/hometask1/blob/main/src/java/03-Polaris/docs/operations/runbooks/alertmanager-down.md"
