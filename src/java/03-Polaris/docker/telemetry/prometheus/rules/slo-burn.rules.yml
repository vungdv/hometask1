# Plan O5: multi-window, multi-burn-rate SLO alerts (design section 4). Windows and factors are PROPOSALS.
# Generic over service and sli: burn = sli:error_ratio:window / sli:error_budget:ratio. An alert needs
# BOTH its long and short window above the factor, and at least ~3 requests/minute of traffic.
groups:
  - name: slo-burn
    rules:
      - alert: SloBurnFast
        expr: |
          (sli:error_ratio:window{window="1h"} > on (service, sli, owner) (14.4 * sli:error_budget:ratio))
          and on (service, sli, owner) (sli:error_ratio:window{window="5m"} > on (service, sli, owner) (14.4 * sli:error_budget:ratio))
          and on (service, sli, owner) (sli:requests:rate5m > 0.05)
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.service }} {{ $labels.sli }} SLO burning at 14.4x or more (2% of the 30d error budget in 1h)"
          description: "Error ratio {{ $labels.service }}/{{ $labels.sli }} is above 14.4x its error budget on both the 1h and 5m windows."
          service: "{{ $labels.service }}"
          severity: "page"
          dashboard_url: '{{ if eq $labels.service "nginx-gateway" }}https://grafana.polaris.local/d/polaris-edge/edge-gateway{{ else }}https://grafana.polaris.local/d/polaris-service-red/service-red?var-service={{ if eq $labels.service "polaris" }}Polaris{{ else }}Polaris-Assistant{{ end }}{{ end }}'
          runbook_url: "https://github.com/vungdv/hometask1/blob/main/src/java/03-Polaris/docs/operations/runbooks/slo-burn-fast.md"

      - alert: SloBurnMedium
        expr: |
          (sli:error_ratio:window{window="6h"} > on (service, sli, owner) (6 * sli:error_budget:ratio))
          and on (service, sli, owner) (sli:error_ratio:window{window="30m"} > on (service, sli, owner) (6 * sli:error_budget:ratio))
          and on (service, sli, owner) (sli:requests:rate5m > 0.05)
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.service }} {{ $labels.sli }} SLO burning at 6x or more (5% of the 30d error budget in 6h)"
          description: "Error ratio {{ $labels.service }}/{{ $labels.sli }} is above 6x its error budget on both the 6h and 30m windows."
          service: "{{ $labels.service }}"
          severity: "page"
          dashboard_url: '{{ if eq $labels.service "nginx-gateway" }}https://grafana.polaris.local/d/polaris-edge/edge-gateway{{ else }}https://grafana.polaris.local/d/polaris-service-red/service-red?var-service={{ if eq $labels.service "polaris" }}Polaris{{ else }}Polaris-Assistant{{ end }}{{ end }}'
          runbook_url: "https://github.com/vungdv/hometask1/blob/main/src/java/03-Polaris/docs/operations/runbooks/slo-burn-medium.md"

      - alert: SloBurnSlow
        expr: |
          (sli:error_ratio:window{window="1d"} > on (service, sli, owner) (3 * sli:error_budget:ratio))
          and on (service, sli, owner) (sli:error_ratio:window{window="2h"} > on (service, sli, owner) (3 * sli:error_budget:ratio))
          and on (service, sli, owner) (sli:requests:rate5m > 0.05)
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.service }} {{ $labels.sli }} SLO burning at 3x or more (10% of the 30d error budget in 1d)"
          description: "Error ratio {{ $labels.service }}/{{ $labels.sli }} is above 3x its error budget on both the 1d and 2h windows."
          service: "{{ $labels.service }}"
          severity: "ticket"
          dashboard_url: '{{ if eq $labels.service "nginx-gateway" }}https://grafana.polaris.local/d/polaris-edge/edge-gateway{{ else }}https://grafana.polaris.local/d/polaris-service-red/service-red?var-service={{ if eq $labels.service "polaris" }}Polaris{{ else }}Polaris-Assistant{{ end }}{{ end }}'
          runbook_url: "https://github.com/vungdv/hometask1/blob/main/src/java/03-Polaris/docs/operations/runbooks/slo-burn-slow.md"

      - alert: SloBurnSlowest
        expr: |
          (sli:error_ratio:window{window="3d"} > on (service, sli, owner) (1 * sli:error_budget:ratio))
          and on (service, sli, owner) (sli:error_ratio:window{window="6h"} > on (service, sli, owner) (1 * sli:error_budget:ratio))
          and on (service, sli, owner) (sli:requests:rate5m > 0.05)
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.service }} {{ $labels.sli }} SLO burning at 1x or more (10% of the 30d error budget in 3d)"
          description: "Error ratio {{ $labels.service }}/{{ $labels.sli }} is above 1x its error budget on both the 3d and 6h windows."
          service: "{{ $labels.service }}"
          severity: "ticket"
          dashboard_url: '{{ if eq $labels.service "nginx-gateway" }}https://grafana.polaris.local/d/polaris-edge/edge-gateway{{ else }}https://grafana.polaris.local/d/polaris-service-red/service-red?var-service={{ if eq $labels.service "polaris" }}Polaris{{ else }}Polaris-Assistant{{ end }}{{ end }}'
          runbook_url: "https://github.com/vungdv/hometask1/blob/main/src/java/03-Polaris/docs/operations/runbooks/slo-burn-slowest.md"

