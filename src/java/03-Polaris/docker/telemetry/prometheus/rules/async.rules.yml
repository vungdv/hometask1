# Plan O6 part (b) / OBS-ASY-1: alerts on the outbox and Kafka consumer-group metrics published by part (a)
# (contract: docs/development/design/operational-observability/O6a-async-metrics-contract.md).
# Notes that shape every rule below:
#  - Metrics are reported by the apps themselves and pass the Collector's Prometheus exporter, which keeps the last value of a
#    series for 5 minutes (default metric_expiration) after the app stops reporting. So "absent" only becomes true 5 minutes
#    after the app died; the absence alert's `for` adds to that.
#  - polaris_outbox_backlog_events / ..._oldest_pending_age_seconds are always present (0 when empty): safe to alert on directly.
#  - polaris_kafka_consumer_records_skipped_records_total only exists after the first skip: never alert on its absence.
#  - Lag series appear up to 60 s after a consumer (re)starts; the lag-based alerts need a 10 minute history so cold start cannot fire them.
#  - Alerts use totals and group, never orderNumber; event_type is for the dashboard panels.
#  - `service` labels are distinct per alert family on purpose: Alertmanager's page-inhibits-ticket rule matches equal service and sli.
groups:
  - name: async-recording
    interval: 30s
    rules:
      # Consumer-group lag in records. Only the dotted topic series (the underscore twin is an exporter artefact, see the contract).
      - record: async:consumer_lag:records
        expr: sum by (exported_job, group, topic) (kafka_consumer_fetch_manager_records_lag{topic=~".+\\..+"})

  - name: async-alerts
    rules:
      - alert: OutboxStuck
        # Pending events older than 5 minutes: the relay normally drains in about a second. Both series are always present.
        expr: polaris_outbox_oldest_pending_age_seconds > 300 and on (exported_job) polaris_outbox_backlog_events > 0
        for: 5m
        labels: {severity: page, owner: polaris, service: polaris-outbox}
        annotations:
          summary: "Outbox is stuck: oldest pending event is {{ $value | humanizeDuration }} old"
          description: "Order events are recorded but not reaching Kafka (Kafka down or unreachable, relay failing, or database slow). Break down by event_type on the dashboard."
          service: "polaris-outbox"
          severity: "page"
          dashboard_url: "https://grafana.polaris.local/d/polaris-async/async-outbox-and-kafka"
          runbook_url: "https://github.com/vungdv/hometask1/blob/main/src/java/03-Polaris/docs/operations/runbooks/outbox-stuck.md"

      - alert: ConsumerLagGrowing
        # Lag never reached 100 records or less in 10 minutes AND is still growing: the group is not keeping up.
        expr: |
          (min_over_time(async:consumer_lag:records[10m]) > 100 and deriv(async:consumer_lag:records[10m]) > 0)
          and on (exported_job, group, topic) count_over_time(async:consumer_lag:records[10m]) >= 15
        for: 5m
        labels: {severity: ticket, owner: polaris, service: kafka-consumer}
        annotations:
          summary: "Consumer group {{ $labels.group }} is falling behind on {{ $labels.topic }}: lag above 100 and still growing"
          description: "Lag has stayed above 100 records for 10 minutes and is still growing. A group with no lag series at all (consumer gone) is covered by AsyncMetricsMissing."
          service: "kafka-consumer"
          severity: "ticket"
          dashboard_url: "https://grafana.polaris.local/d/polaris-async/async-outbox-and-kafka"
          runbook_url: "https://github.com/vungdv/hometask1/blob/main/src/java/03-Polaris/docs/operations/runbooks/consumer-lag-growing.md"

      - alert: PoisonRecordBlocked
        # The oldest in-flight record is older than 5 minutes (retries never finish) AND the group still has lag AND reports lag now.
        # Known limitation (O6a review): the consumer's in-flight entry is cleared only on success or skip. If a partition is revoked or
        # the container stops mid-record the age can keep growing. Requiring the group to have lag > 0 (series disappear or drain after
        # a revoke) and the series to be fresh (the exporter drops a dead app's series after 5 minutes) tolerates that, but a revoked
        # partition whose lag series lingers can still raise a false ticket: see the runbook.
        expr: |
          polaris_kafka_consumer_oldest_record_age_seconds > 300
          and on (exported_job, group) (sum by (exported_job, group) (async:consumer_lag:records) > 0)
        for: 5m
        labels: {severity: ticket, owner: polaris, service: kafka-consumer}
        annotations:
          summary: "Consumer group {{ $labels.group }} is blocked: oldest in-flight record is {{ $value | humanizeDuration }} old with lag"
          description: "A record keeps failing (poison record) or its handler is stuck, so the group makes no progress on that partition."
          service: "kafka-consumer"
          severity: "ticket"
          dashboard_url: "https://grafana.polaris.local/d/polaris-async/async-outbox-and-kafka"
          runbook_url: "https://github.com/vungdv/hometask1/blob/main/src/java/03-Polaris/docs/operations/runbooks/poison-record-blocked.md"

      - alert: AsyncMetricsMissing
        # The reporting side died or stopped exporting: nothing above can fire then. Each absent() has its own label set, so `or` keeps all.
        # No cold-start false alert: the series are exported from the first scrape of a running app, and `for` plus the exporter's
        # 5 minute retention mean a restart shorter than ~15 minutes does not fire.
        expr: |
          absent(polaris_outbox_backlog_events{exported_job="Polaris"})
          or absent(polaris_kafka_consumer_oldest_record_age_seconds{exported_job="Polaris", group="order.shipments"})
          or absent(polaris_kafka_consumer_oldest_record_age_seconds{exported_job="Polaris-Fulfilment-Emulator"})
        for: 10m
        labels: {severity: ticket, owner: polaris, service: kafka-consumer}
        annotations:
          summary: "Async visibility metrics are missing: the outbox or a Kafka consumer is not reporting"
          description: "The outbox gauges, the order.shipments consumer or the fulfilment emulator consumers have not reported for 15 minutes (app down, Collector not forwarding, or metrics wiring broken). Lag and stuck alerts cannot fire without them."
          service: "kafka-consumer"
          severity: "ticket"
          dashboard_url: "https://grafana.polaris.local/d/polaris-async/async-outbox-and-kafka"
          runbook_url: "https://github.com/vungdv/hometask1/blob/main/src/java/03-Polaris/docs/operations/runbooks/async-metrics-missing.md"
