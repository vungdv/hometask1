# Plan O5: SLO targets as data. PROPOSALS, pending review (design section 2).
# error budget = 1 - target over 30 days. Change an SLO here and in the unit tests.
#   nginx-gateway     availability 99.5 %   latency 95 % <= 1.024 s
#   polaris           availability 99.5 %   latency 95 % <= 1.024 s
#   polaris-assistant availability 99.0 %   latency 95 % <= 8.192 s
groups:
  - name: slo-targets
    interval: 30s
    rules:
      - {record: "sli:error_budget:ratio", expr: "vector(0.005)", labels: {service: nginx-gateway, sli: availability, owner: platform}}
      - {record: "sli:error_budget:ratio", expr: "vector(0.05)",  labels: {service: nginx-gateway, sli: latency, owner: platform}}
      - {record: "sli:error_budget:ratio", expr: "vector(0.005)", labels: {service: polaris, sli: availability, owner: polaris}}
      - {record: "sli:error_budget:ratio", expr: "vector(0.05)",  labels: {service: polaris, sli: latency, owner: polaris}}
      - {record: "sli:error_budget:ratio", expr: "vector(0.01)",  labels: {service: polaris-assistant, sli: availability, owner: assistant}}
      - {record: "sli:error_budget:ratio", expr: "vector(0.05)",  labels: {service: polaris-assistant, sli: latency, owner: assistant}}
# Constraint: a fast burn (14.4x) is only reachable when the budget is below 1/14.4 (6.9 %), so no latency target may be below 93.1 %.
