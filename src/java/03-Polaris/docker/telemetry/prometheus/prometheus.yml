global:
  scrape_interval: 15s
  evaluation_interval: 30s

# Plan O5: SLI recording rules, multi-window burn-rate alerts and pipeline alerts (D2).
# rules-test/ is empty in git; scripts/telemetry/alerts-check.sh drops a generated, short-window,
# TEST-ONLY copy of the burn rules there while it runs a live failure-injection check.
rule_files:
  - /etc/prometheus/rules/*.yml
  - /etc/prometheus/rules-test/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # Application metrics re-exported by the collector's prometheus exporter
  - job_name: 'otel-collector'
    scrape_interval: 10s
    static_configs:
      - targets: ['otel-collector:8889']

  # Collector self-metrics (accepted/refused/dropped, exporter queue and failures)
  - job_name: 'otel-collector-self'
    scrape_interval: 10s
    static_configs:
      - targets: ['otel-collector:8888']

  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']

  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
