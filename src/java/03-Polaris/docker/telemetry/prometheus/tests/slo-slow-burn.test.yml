rule_files:
  - ../rules/sli-base.rules.yml
  - ../rules/sli-windows.rules.yml
  - ../rules/slo-targets.rules.yml
  - ../rules/slo-burn.rules.yml
  - ../rules/pipeline.rules.yml
evaluation_interval: 30s
tests:
  # 2 % 5xx for 25h at 10 req/s = burn 4x: the 1d slow ticket fires, fast and medium pages stay silent.
  - interval: 30s
    input_series:
      - series: 'traces_spanmetrics_calls_total{service="nginx-gateway",span_kind="SPAN_KIND_SERVER",polaris_sse="false",http_response_status_code="200"}'
        values: '0+294x3000'
      - series: 'traces_spanmetrics_calls_total{service="nginx-gateway",span_kind="SPAN_KIND_SERVER",polaris_sse="false",http_response_status_code="500"}'
        values: '0+6x3000'
    alert_rule_test:
      - eval_time: 25h
        alertname: SloBurnFast
        exp_alerts: []
      - eval_time: 25h
        alertname: SloBurnMedium
        exp_alerts: []
      # only 25h of history exists: the 3d window is not evaluated yet (history guard), so no false page from thin data
      - eval_time: 25h
        alertname: SloBurnSlowest
        exp_alerts: []
      - eval_time: 25h
        alertname: SloBurnSlow
        exp_alerts:
          - exp_labels: {severity: ticket, service: nginx-gateway, sli: availability, owner: platform}
            exp_annotations:
              summary: "nginx-gateway availability SLO burning at 3x or more (10% of the 30d error budget in 1d)"
              description: "Error ratio nginx-gateway/availability is above 3x its error budget on both the 1d and 2h windows."
              service: "nginx-gateway"
              severity: "ticket"
              dashboard_url: "https://grafana.polaris.local/d/polaris-edge/edge-gateway"
              runbook_url: "https://github.com/vungdv/hometask1/blob/main/src/java/03-Polaris/docs/operations/runbooks/slo-burn-slow.md"

  # History guard: 100 % errors for only 20 minutes of data (fresh stack). Long windows are not yet
  # trustworthy, so nothing pages.
  - interval: 30s
    input_series:
      - series: 'traces_spanmetrics_calls_total{service="nginx-gateway",span_kind="SPAN_KIND_SERVER",polaris_sse="false",http_response_status_code="200"}'
        values: '0+0x40'
      - series: 'traces_spanmetrics_calls_total{service="nginx-gateway",span_kind="SPAN_KIND_SERVER",polaris_sse="false",http_response_status_code="500"}'
        values: '0+300x40'
    alert_rule_test:
      - {eval_time: 20m, alertname: SloBurnFast, exp_alerts: []}
      - {eval_time: 20m, alertname: SloBurnMedium, exp_alerts: []}
