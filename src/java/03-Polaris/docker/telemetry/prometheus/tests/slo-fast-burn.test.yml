rule_files:
  - ../rules/sli-base.rules.yml
  - ../rules/sli-windows.rules.yml
  - ../rules/slo-targets.rules.yml
  - ../rules/slo-burn.rules.yml
  - ../rules/pipeline.rules.yml
evaluation_interval: 30s
tests:
  # Edge availability: 10 req/s healthy for 3h, then 100% 5xx. Fast burn (14.4x on 1h and 5m) pages.
  - interval: 30s
    input_series:
      - series: 'traces_spanmetrics_calls_total{service="nginx-gateway",span_kind="SPAN_KIND_SERVER",polaris_sse="false",http_response_status_code="200"}'
        values: '0+300x360 108000+0x400'
      - series: 'traces_spanmetrics_calls_total{service="nginx-gateway",span_kind="SPAN_KIND_SERVER",polaris_sse="false",http_response_status_code="500"}'
        values: '0+0x360 0+300x400'
    alert_rule_test:
      - eval_time: 175m
        alertname: SloBurnFast
        exp_alerts: []
      - eval_time: 190m
        alertname: SloBurnFast
        exp_alerts:
          - exp_labels: {severity: page, service: nginx-gateway, sli: availability, owner: platform}
            exp_annotations:
              summary: "nginx-gateway availability SLO burning at 14.4x or more (2% of the 30d error budget in 1h)"
              description: "Error ratio nginx-gateway/availability is above 14.4x its error budget on both the 1h and 5m windows."
              service: "nginx-gateway"
              severity: "page"
              dashboard_url: "https://grafana.polaris.local/d/polaris-edge/edge-gateway"
              runbook_url: "https://github.com/vungdv/hometask1/blob/main/src/java/03-Polaris/docs/operations/runbooks/slo-burn-fast.md"

  # Polaris availability from APP metrics (exported_job=Polaris, capitalised) is normalised to service=polaris.
  - interval: 30s
    input_series:
      - series: 'http_server_requests_milliseconds_count{exported_job="Polaris",status="200",uri="/api/v1/orders"}'
        values: '0+300x360 108000+0x400'
      - series: 'http_server_requests_milliseconds_count{exported_job="Polaris",status="500",uri="/api/v1/orders"}'
        values: '0+0x360 0+300x400'
    alert_rule_test:
      - eval_time: 190m
        alertname: SloBurnFast
        exp_alerts:
          - exp_labels: {severity: page, service: polaris, sli: availability, owner: polaris}
            exp_annotations:
              summary: "polaris availability SLO burning at 14.4x or more (2% of the 30d error budget in 1h)"
              description: "Error ratio polaris/availability is above 14.4x its error budget on both the 1h and 5m windows."
              service: "polaris"
              severity: "page"
              dashboard_url: "https://grafana.polaris.local/d/polaris-service-red/service-red?var-service=Polaris"
              runbook_url: "https://github.com/vungdv/hometask1/blob/main/src/java/03-Polaris/docs/operations/runbooks/slo-burn-fast.md"

  # Assistant latency measured at the gateway (SSE excluded): all requests slower than 8.192 s after 3h; the budget is 5 %, so 14.4x needs 72 % slow on 1h (about 44 min).
  - interval: 30s
    input_series:
      - series: 'traces_spanmetrics_latency_count{service="nginx-gateway",span_kind="SPAN_KIND_SERVER",polaris_sse="false",span_name="assistant:/v3/api-docs"}'
        values: '0+300x760'
      - series: 'traces_spanmetrics_latency_bucket{service="nginx-gateway",span_kind="SPAN_KIND_SERVER",polaris_sse="false",span_name="assistant:/v3/api-docs",le="8.192"}'
        values: '0+300x360 108000+0x400'
      # SSE traffic is slow by design and must not count
      - series: 'traces_spanmetrics_latency_count{service="nginx-gateway",span_kind="SPAN_KIND_SERVER",polaris_sse="true",span_name="assistant:/api/v1/assistant"}'
        values: '0+300x760'
      - series: 'traces_spanmetrics_latency_bucket{service="nginx-gateway",span_kind="SPAN_KIND_SERVER",polaris_sse="true",span_name="assistant:/api/v1/assistant",le="8.192"}'
        values: '0+0x760'
    alert_rule_test:
      - eval_time: 175m
        alertname: SloBurnFast
        exp_alerts: []
      - eval_time: 230m
        alertname: SloBurnFast
        exp_alerts:
          - exp_labels: {severity: page, service: polaris-assistant, sli: latency, owner: assistant}
            exp_annotations:
              summary: "polaris-assistant latency SLO burning at 14.4x or more (2% of the 30d error budget in 1h)"
              description: "Error ratio polaris-assistant/latency is above 14.4x its error budget on both the 1h and 5m windows."
              service: "polaris-assistant"
              severity: "page"
              dashboard_url: "https://grafana.polaris.local/d/polaris-service-red/service-red?var-service=Polaris-Assistant"
              runbook_url: "https://github.com/vungdv/hometask1/blob/main/src/java/03-Polaris/docs/operations/runbooks/slo-burn-fast.md"

