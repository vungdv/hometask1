rule_files:
  - ../rules/sli-base.rules.yml
  - ../rules/sli-windows.rules.yml
  - ../rules/slo-targets.rules.yml
  - ../rules/slo-burn.rules.yml
  - ../rules/pipeline.rules.yml
evaluation_interval: 30s
tests:
  # Healthy: 0.1 % 5xx (burn 0.2x) for 30h. Nothing fires.
  - interval: 30s
    input_series:
      - series: 'traces_spanmetrics_calls_total{service="nginx-gateway",span_kind="SPAN_KIND_SERVER",polaris_sse="false",http_response_status_code="200"}'
        values: '0+299.7x3600'
      - series: 'traces_spanmetrics_calls_total{service="nginx-gateway",span_kind="SPAN_KIND_SERVER",polaris_sse="false",http_response_status_code="500"}'
        values: '0+0.3x3600'
    alert_rule_test:
      - {eval_time: 30h, alertname: SloBurnFast, exp_alerts: []}
      - {eval_time: 30h, alertname: SloBurnMedium, exp_alerts: []}
      - {eval_time: 30h, alertname: SloBurnSlow, exp_alerts: []}
      - {eval_time: 30h, alertname: SloBurnSlowest, exp_alerts: []}
  # Low-traffic guard: 100 % errors but only 0.01 req/s (under the 0.05 req/s floor) must not page.
  - interval: 30s
    input_series:
      - series: 'traces_spanmetrics_calls_total{service="nginx-gateway",span_kind="SPAN_KIND_SERVER",polaris_sse="false",http_response_status_code="500"}'
        values: '0+0.3x400'
    alert_rule_test:
      - {eval_time: 3h, alertname: SloBurnFast, exp_alerts: []}
  # SSE-only failures are excluded from the edge SLI.
  - interval: 30s
    input_series:
      - series: 'traces_spanmetrics_calls_total{service="nginx-gateway",span_kind="SPAN_KIND_SERVER",polaris_sse="false",http_response_status_code="200"}'
        values: '0+300x400'
      - series: 'traces_spanmetrics_calls_total{service="nginx-gateway",span_kind="SPAN_KIND_SERVER",polaris_sse="true",http_response_status_code="500"}'
        values: '0+300x400'
    alert_rule_test:
      - {eval_time: 3h, alertname: SloBurnFast, exp_alerts: []}
    promql_expr_test:
      - expr: sli:bad_requests:rate5m{service="nginx-gateway",sli="availability"}
        eval_time: 3h
        exp_samples:
          - {labels: 'sli:bad_requests:rate5m{owner="platform",service="nginx-gateway",sli="availability"}', value: 0}
  # Label normalisation: app metrics (exported_job) and span metrics (service) both become service=<lower-case>.
  - interval: 30s
    input_series:
      - series: 'http_server_requests_milliseconds_count{exported_job="Polaris-Assistant",status="503"}'
        values: '0+30x40'
      - series: 'http_server_requests_milliseconds_count{exported_job="Polaris-Assistant",status="200"}'
        values: '0+270x40'
      - series: 'traces_spanmetrics_latency_count{service="nginx-gateway",span_kind="SPAN_KIND_SERVER",polaris_sse="false",span_name="polaris:/"}'
        values: '0+300x40'
      - series: 'traces_spanmetrics_latency_bucket{service="nginx-gateway",span_kind="SPAN_KIND_SERVER",polaris_sse="false",span_name="polaris:/",le="1.024"}'
        values: '0+270x40'
    promql_expr_test:
      - expr: sli:requests:rate5m{service="polaris-assistant",sli="availability"}
        eval_time: 15m
        exp_samples:
          - {labels: 'sli:requests:rate5m{owner="assistant",service="polaris-assistant",sli="availability"}', value: 10}
      - expr: sli:error_ratio:window{service="polaris-assistant",sli="availability",window="5m"}
        eval_time: 15m
        exp_samples:
          - {labels: 'sli:error_ratio:window{owner="assistant",service="polaris-assistant",sli="availability",window="5m"}', value: 0.1}
      - expr: sli:error_ratio:window{service="polaris",sli="latency",window="5m"}
        eval_time: 15m
        exp_samples:
          - {labels: 'sli:error_ratio:window{owner="polaris",service="polaris",sli="latency",window="5m"}', value: 0.1}
