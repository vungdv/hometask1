# Plan O5 / D5: Alertmanager DEV routing. Contains no secrets (12-factor): Mailpit accepts unauthenticated
# SMTP on the private network and the webhook target is an internal URL. For a real SMTP relay or webhook use
# the *_file settings (smtp_auth_password_file, url_file) mounted from the environment's secret store.
# Q2 (who receives pages in production) is UNANSWERED: nothing here is a production route.
global:
  smtp_smarthost: mailpit:1025
  smtp_from: alertmanager@polaris.local
  smtp_require_tls: false
  resolve_timeout: 5m

route:
  receiver: catch-all
  group_by: [alertname, service, sli]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    - matchers: [severity="page"]
      routes:
        - {matchers: ['owner="platform"'],  receiver: platform-page}
        - {matchers: ['owner="polaris"'],   receiver: polaris-page}
        - {matchers: ['owner="assistant"'], receiver: assistant-page}
    - matchers: [severity="ticket"]
      routes:
        - {matchers: ['owner="platform"'],  receiver: platform-ticket}
        - {matchers: ['owner="polaris"'],   receiver: polaris-ticket}
        - {matchers: ['owner="assistant"'], receiver: assistant-ticket}

inhibit_rules:
  # a page for the same service and SLI makes the lower-severity ticket redundant
  - source_matchers: [severity="page"]
    target_matchers: [severity="ticket"]
    equal: [service, sli]
  # the gateway looks down whenever the Collector is down: report the cause only
  - source_matchers: [alertname="TelemetryCollectorDown"]
    target_matchers: [alertname="GatewayDown"]

receivers:
  - name: catch-all
    email_configs:
      - {to: unrouted@polaris.local, send_resolved: true}
  - name: platform-page
    email_configs: [{to: platform-oncall@polaris.local, send_resolved: true}]
    webhook_configs: [{url: 'http://alert-webhook:8080/alerts/platform', send_resolved: true}]
  - name: polaris-page
    email_configs: [{to: polaris-oncall@polaris.local, send_resolved: true}]
    webhook_configs: [{url: 'http://alert-webhook:8080/alerts/polaris', send_resolved: true}]
  - name: assistant-page
    email_configs: [{to: assistant-oncall@polaris.local, send_resolved: true}]
    webhook_configs: [{url: 'http://alert-webhook:8080/alerts/assistant', send_resolved: true}]
  - name: platform-ticket
    email_configs: [{to: platform-team@polaris.local, send_resolved: false}]
  - name: polaris-ticket
    email_configs: [{to: polaris-team@polaris.local, send_resolved: false}]
  - name: assistant-ticket
    email_configs: [{to: assistant-team@polaris.local, send_resolved: false}]
