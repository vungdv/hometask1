auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  filesystem:
    directory: /loki/chunks

compactor:
  working_directory: /loki/compactor
  compactor_ring:
    kvstore:
      store: inmemory

limits_config:
  allow_structured_metadata: true
  volume_enabled: true
  # Cardinality guardrails (plan O3, OBS-MET-1/OBS-LOG-1): only these resource attributes are
  # index labels; everything else is structured metadata (not indexed). Hard limits below.
  otlp_config:
    resource_attributes:
      ignore_defaults: true
      attributes_config:
        - action: index_label
          attributes:
            - service.name
            - service.namespace
            - deployment.environment
  max_label_names_per_series: 8
  max_label_name_length: 64
  max_label_value_length: 256
  max_global_streams_per_user: 5000
  max_streams_per_user: 0
  max_structured_metadata_entries_count: 128
