# https://opentelemetry.io/docs/collector/configuration/
# Pipeline hardening (plan O1, OBS-RES-1 / OBS-PIPE-1):
#   - memory_limiter is FIRST in every pipeline
#   - every exporter has a bounded sending_queue and retry_on_failure; when a backend is
#     down the queue fills, then data is dropped (never back-pressures the apps for long)
#   - collector self-metrics on :8888 are scraped by Prometheus
#   - health_check on :13133 drives the compose healthcheck

extensions:
  health_check:
    endpoint: "0.0.0.0:13133"

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 30
    spike_limit_percentage: 6
  batch:
    timeout: 2s
    send_batch_max_size: 8192

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 120s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 1000        # batches; bounded, new data is refused (dropped) when full
  prometheus:
    endpoint: "0.0.0.0:8889"  # prometheus scrapes this; pull-based, no queue applies
  otlp_http/logs:
    endpoint: "http://loki:3100/otlp"
    tls:
      insecure: true
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 120s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 1000

service:
  extensions: [health_check]
  telemetry:
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/logs]
