receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  debug:
    verbosity: detailed
  # Swap/add real backends later, e.g.:
  # otlp/tempo:
  #   endpoint: tempo:4317
  #   tls:
  #     insecure: true
  # prometheusremotewrite:
  #   endpoint: http://prometheus:9090/api/v1/write

# ============================
  # TRACES -> TEMPO
  # ============================
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # ============================
  # LOGS -> LOKI
  # ============================
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

  # ============================
  # METRICS -> PROMETHEUS
  # ============================
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: 
        - debug
        - otlp/tempo
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters:
        - debug
        - prometheus
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: 
        - debug
        - otlphttp/loki