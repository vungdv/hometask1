services:

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus

    ports:
      - "9090:9090"
    networks:
      - polaris-net

    volumes:
      - ./telemetry/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

  loki:
    image: grafana/loki:3.1.0
    container_name: loki

    ports:
      - "3100:3100"
    networks:
      - polaris-net

    volumes:
      - ./telemetry/loki/loki.yml:/etc/loki/config.yml
      - loki-data:/loki

    command:
      - "-config.file=/etc/loki/config.yml"
  logseeding:
    image: python:3.11-slim
    container_name: logseeding
    working_dir: /app
    # Mount your script into the container (edit locally, no rebuild needed)
    volumes:
      - ./telemetry/sample-logs/logseeding.py:/app/logseeding.py:ro
    # Install requests once, then idle so the container stays up for `docker exec`.
    # requests is installed into a volume-backed dir so it survives restarts
    # (skip re-downloading every time you recreate the container).
    command: ["sh", "-c", "pip install --no-cache-dir requests && tail -f /dev/null"]
    environment:
      - PYTHONUNBUFFERED=1
      - LOKI_URL=http://loki:3100
    networks:
      - polaris-net
  tempo:
    image: grafana/tempo:latest
    container_name: tempo

    ports:
      - "3200:3200"
      - "4319:4317"
    networks:
      - polaris-net

    volumes:
      - ./telemetry/tempo/tempo.yml:/etc/tempo/config.yml
      - tempo-data:/var/tempo

    command:
      - "-config.file=/etc/tempo/config.yml"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector

    command:
      - "--config=/etc/otelcol-contrib/config.yaml"

    volumes:
      - ./telemetry/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml

    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    networks:
      - polaris-net

    depends_on:
      - tempo
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: grafana

    ports:
      - "3000:3000"
    networks:
      - polaris-net

    volumes:
      - grafana-data:/var/lib/grafana
      - ./telemetry/grafana/provisioning:/etc/grafana/provisioning

volumes:

  prometheus-data:

  loki-data:

  tempo-data:

  grafana-data:

networks:
  polaris-net: