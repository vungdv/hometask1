services:

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus

    ports:
      - "9090:9090"
    networks:
      - polaris-net

    volumes:
      - ./telemetry/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

  loki:
    image: grafana/loki:latest
    container_name: loki

    ports:
      - "3100:3100"
    networks:
      - polaris-net

    volumes:
      - ./telemetry/loki/loki.yml:/etc/loki/config.yml
      - loki-data:/loki

    command:
      - "-config.file=/etc/loki/config.yml"

  tempo:
    image: grafana/tempo:latest
    container_name: tempo

    ports:
      - "3200:3200"
      - "4319:4317"
    networks:
      - polaris-net

    volumes:
      - ./telemetry/tempo/tempo.yml:/etc/tempo/config.yml
      - tempo-data:/var/tempo

    command:
      - "-config.file=/etc/tempo/config.yml"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector

    command:
      - "--config=/etc/otelcol-contrib/config.yaml"

    volumes:
      - ./telemetry/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml

    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    networks:
      - polaris-net

    depends_on:
      - tempo
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: grafana

    ports:
      - "3000:3000"
    networks:
      - polaris-net

    volumes:
      - grafana-data:/var/lib/grafana
      - ./telemetry/grafana/provisioning:/etc/grafana/provisioning

volumes:

  prometheus-data:

  loki-data:

  tempo-data:

  grafana-data:

networks:
  polaris-net: