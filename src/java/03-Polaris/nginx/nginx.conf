events {}

http {
  # Redirect all HTTP to HTTPS
  server {
    listen 80;
    server_name polaris.local id.polaris.local;
    return 301 https://$host$request_uri;
  }

  # App
  server {
    listen 443 ssl;
    server_name polaris.local;

    ssl_certificate     /etc/nginx/certs/polaris.local+1.pem;
    ssl_certificate_key /etc/nginx/certs/polaris.local+1-key.pem;

    location / {
      proxy_pass http://polaris:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;
    }
  }

  # Keycloak
  server {
    listen 443 ssl;
    server_name id.polaris.local;

    ssl_certificate     /etc/nginx/certs/polaris.local+1.pem;
    ssl_certificate_key /etc/nginx/certs/polaris.local+1-key.pem;

    location / {
      proxy_pass http://keycloak:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;
    }
  }
}